baseURL: "https://jiaxinzhang97.github.io/"
title: "Jiaxin Zhang"
theme: PaperMod

languageCode: "en-us"
enableRobotsTXT: true
enableInlineShortcodes: true
buildDrafts: false
buildFuture: false
buildExpired: false

# Show reading-time / word-count etc.
enableEmoji: true

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # enables Google Analytics/OpenGraph/Twitter cards etc. when deployed
  description: "Jiaxin Zhang — Ph.D. Candidate in Electrical & Computer Engineering at Johns Hopkins University. Medical ultrasound, imaging AI, and image reconstruction."
  author: "Jiaxin Zhang"
  # keywords used for SEO
  keywords: ["Medical Ultrasound", "Medical Imaging AI", "Image Reconstruction", "Photoacoustic Imaging", "Johns Hopkins"]

  defaultTheme: auto # auto | light | dark — "auto" follows the visitor's system setting
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false
  disableSpecial1stPost: false
  hideMeta: false
  hideSummary: false

  # ----- Homepage: Profile Mode -----
  # Landing page = a personal intro with a photo, name, role, an introduction,
  # and social icons (rendered by the custom two-column layout in layouts/).
  profileMode:
    enabled: true
    title: "Jiaxin Zhang"                                # name shown under the photo
    role: "Ph.D. Candidate<br>Johns Hopkins University"  # title lines under the name (use <br> for a new line)
    # Right-column introduction. Markdown works; a blank line starts a new paragraph.
    subtitle: |
      Hi! I am a Ph.D. candidate in Electrical & Computer Engineering at
      Johns Hopkins University, advised by [<u>Prof. Muyinatu Bell</u>](https://pulselab.jhu.edu/).
      My research focuses on **medical ultrasound and photoacoustics** and **imaging AI** — building physics-informed models and deep learning
      systems for ultrasound, photoacoustic, and multimodal imaging to guide
      surgical interventions and improve healthcare diagnosis.

      I am currently on the full-time job market, seeking R&D, Research Scientist, and Engineer opportunities.
      Feel free to reach out via [<u>email</u>](mailto:jzhan295@jhu.edu) or [<u>LinkedIn</u>](https://www.linkedin.com/in/jiaxin-zhang-015866175/)!
      
    # I am currently on the full-time job market! Feel free to
    # reach out via email or LinkedIn.

      

    imageUrl: "/images/cover.png"
    imagetitle: "Jiaxin Zhang"
    imageWidth: 200
    imageHeight: 200
    # Hero buttons removed for this sidebar layout — the top menu handles navigation.
    # To bring them back, add a `buttons:` list here (see PaperMod docs).

  # ----- Social / contact icons (shown on the profile card and footer) -----
  socialIcons:
    - name: email
      title: "Email me"
      url: "mailto:jzhan295@jhu.edu"
    - name: googlescholar
      title: "Google Scholar"
      url: "https://scholar.google.com/citations?user=QEuGxdMAAAAJ&hl=en"
    - name: linkedin
      title: "LinkedIn"
      url: "https://www.linkedin.com/in/jiaxin-zhang-015866175/"
    # To add more icons (e.g. github), add another "- name: ... url: ..." block here.

  # Cover image used for link previews / OpenGraph on the home page
  images: ["/images/cover.png"]

  # Nice fade-in on load
  assets:
    disableHLJS: false
    favicon: "/images/cover.png"
    favicon16x16: "/images/cover.png"
    favicon32x32: "/images/cover.png"
    apple_touch_icon: "/images/cover.png"

  # Edit-on-github link etc. left off intentionally

# ----- Top navigation menu -----
menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 10
    - identifier: publications
      name: Publications
      url: /publications/
      weight: 20
    - identifier: experience
      name: Experience
      url: /experience/
      weight: 30
    - identifier: beyond
      name: Beyond Work
      url: /beyond-work/
      weight: 40
    - identifier: search
      name: Search
      url: /search/
      weight: 50

# Enable site search (works with the /search/ page created in content/)
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Markup / syntax highlighting
markup:
  goldmark:
    renderer:
      unsafe: true # allow inline HTML (e.g. <br>, <b>) in the profile subtitle & content
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai
